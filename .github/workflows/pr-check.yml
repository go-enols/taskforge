name: PR Check

on:
  pull_request:
    branches: [master]

jobs:
  check:
    name: Type Check & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Type check (client)
        working-directory: ./client
        run: npm run typecheck

      - name: Lint (client)
        working-directory: ./client
        run: npm run lint

      - name: i18n check (client)
        working-directory: ./client
        run: npm run i18n:check

      - name: Test (client)
        working-directory: ./client
        continue-on-error: true # 预存上游测试漂移（settings/transport/analytics 等历史用例），非阻塞
        run: npm test

      - name: Build (client)
        working-directory: ./client
        run: npx electron-vite build

      - name: Verify build artifacts (sandbox enforcer etc.)
        working-directory: ./client
        run: npm run verify:artifacts

      - name: Verify shared schema copies are in sync
        working-directory: ./client
        run: node scripts/sync-shared-schemas.cjs --check

      - name: Setup Node.js (server)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        working-directory: ./server
        run: npm install

      - name: Type check (server)
        working-directory: ./server
        run: npx tsc --noEmit --skipLibCheck

      - name: Test (server)
        working-directory: ./server
        run: npm test
