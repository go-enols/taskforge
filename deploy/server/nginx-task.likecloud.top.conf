# TaskForge Marketplace Server — task.likecloud.top
# 由 systemd 服务 taskforge-marketplace 提供 127.0.0.1:8268
# 证书复用 Cloudflare Origin CA 通配符证书 (*.likecloud.top)
#
# 真实客户端 IP：Cloudflare 回源时携带 CF-Connecting-IP，
# 下面只信任 Cloudflare 官方网段（来源：https://www.cloudflare.com/ips-v4 + ips-v6），
# 直连源站的伪造请求不会被 real_ip 采信。
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name task.likecloud.top;

    # 统一跳转 HTTPS（Cloudflare Full / Full(strict) 模式下由边缘回源 443）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name task.likecloud.top;

    ssl_certificate     /etc/nginx/ssl/likecloud.top.pem;
    ssl_certificate_key /etc/nginx/ssl/likecloud.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 脚本 zip 上传：服务端 multer 限制 50MB，留出 multipart 余量
    client_max_body_size 60m;

    add_header Strict-Transport-Security "max-age=15552000" always;

    access_log /var/log/nginx/taskforge.access.log;
    error_log  /var/log/nginx/taskforge.error.log;

    # ── 移动端 PWA（静态托管）: https://task.likecloud.top/app/ ──
    location = / {
        return 302 /app/;
    }

    location = /app/index.html {
        root /home/ubuntu/taskforge/mobile;
        expires -1;
    }

    location = /app/sw.js {
        root /home/ubuntu/taskforge/mobile;
        expires -1;
    }


    location /app/assets/ {
        root /home/ubuntu/taskforge/mobile;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /app/ {
        root /home/ubuntu/taskforge/mobile;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # ── API 反向代理 ──
    location / {
        proxy_pass http://127.0.0.1:8268;
        proxy_http_version 1.1;

        # $remote_addr 已被 real_ip 模块还原为真实客户端 IP
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 上传时不在 nginx 侧整体缓冲，直接转发给 Node
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
