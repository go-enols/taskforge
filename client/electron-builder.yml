appId: com.electron.app
productName: TaskForge
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/**'
  - '!scripts/**'
  - '!{build,resources}/**/*.{md,map}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  # 安全关键：任务子进程以 NODE_OPTIONS=--require 加载该文件，必须放在 asar 之外
  # （asar 内部路径外部 node 进程不可读）。task.ts 会优先从 process.resourcesPath 查找。
  - from: src/main/services/sandbox-enforcer.cjs
    to: sandbox-enforcer.cjs
asarUnpack:
  - resources/**
win:
  executableName: taskforge
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the device's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the device's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: go-enols
  repo: taskforge
  releaseType: release
  vPrefixedTagName: true
  channel: latest
  publishAutoUpdate: true
